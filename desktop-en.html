  75% {
    transform: translateX(4px) rotate(3deg);

  }

    opacity: 1;
  }

  }
}

  }

  }
  50% {
    opacity: .55;
  }

    transform: scale(1,1);

  }
}

  }

  }
}

  }

  }

}

}

}

@layer components {
  input::placeholder,
  textarea::placeholder {
    opacity: 1;
    color: var(--muted-foreground);
  }
}
.slot-machine-text {
  display: inline-block;
  position: relative;
  transition: transform 0.3s ease-out, opacity 0.3s ease-out;
}
.slot-machine-text.animating {
  animation: pulse-glow 0.5s ease-in-out infinite alternate;
}
.slot-machine-text.complete {
  animation: final-shine 1s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .slot-machine-text {
    transition: none;
  }
  .slot-machine-text.animating,
  .slot-machine-text.complete {
    animation: none;
  }
}
.animate-sparkle-left {
  animation: sparkle-twinkle 2.5s ease-in-out infinite;
  animation-delay: 0.3s;
}
.animate-sparkle-right {
  animation: sparkle-twinkle 2.5s ease-in-out infinite;
  animation-delay: 1.5s;
}
@media (prefers-reduced-motion: reduce) {
  .animate-lightning-left,
  .animate-lightning-right {
    animation: none;
    filter: drop-shadow(0 0 4px currentColor);
  }
  .animate-sparkle-left,
  .animate-sparkle-right {
    animation: none;
    opacity: 0.8;
  }
}
.low-end-device .animate-lightning-left,
.low-end-device .animate-lightning-right {
  animation: none;
  filter: drop-shadow(0 0 3px currentColor);
}
.low-end-device .animate-sparkle-left,
.low-end-device .animate-sparkle-right {
  animation: none;
}
.tile-texture-meadows,
.tile-texture-springs,
.tile-texture-caverns {
  position: relative;
}
.tile-texture-meadows::after,
.tile-texture-springs::after,
.tile-texture-caverns::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  z-index: 1;
}
.tile-texture-meadows::after {
  background: linear-gradient(
    180deg,
    rgba(190, 255, 0, 0.04) 0%,
    rgba(139, 90, 43, 0.03) 100%
  );
}
.tile-texture-springs::after {
  background: linear-gradient(
    180deg,
    rgba(200, 230, 255, 0.08) 0%,
    rgba(0, 200, 220, 0.04) 100%

.wrap {

.wrap[data-size='desktop'] {

.tray {
  position: relative;

  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
  gap: var(--gap);
  width: 100%;
  aspect-ratio: var(--cols) / var(--rows);

.tray[data-live-tier='2'] { --rib: var(--neo-orange); }
.tray[data-live-tier='3'] { --rib: var(--neo-yellow); }
.tray[data-tier='2'] { --rib: var(--neo-orange); }
.tray[data-tier='3'] { --rib: var(--neo-yellow); }
.tray[data-verdict='good'] { --rib: var(--neo-lime); }
.tray[data-verdict='bad'] { --rib: var(--neo-red); }
.tray[data-verdict='dupe'] { --rib: var(--neo-yellow); }

/* The board itself never scales or dips — only tiles move. A tray-level

.tray[data-verdict='bad'] { animation: trayShake 320ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

.tile {
  --lift: translateY(-5px) scale(1.04);
  --spring: cubic-bezier(0.22, 1.3, 0.36, 1);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  min-width: 0;
  min-height: 0;
  cursor: pointer;

.face {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  border: 3px solid var(--ink);
  border-radius: min(14px, 24%);
  background: linear-gradient(180deg, #fffef0 0%, #f6efd6 100%);

  pointer-events: none;
}

  position: absolute;
  inset: -3px;
  border: 3px solid var(--rib);
  border-radius: inherit;
  opacity: 0;
  pointer-events: none;

.glyphs {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
  gap: var(--gap);
  padding: var(--pad);
  padding-bottom: calc(var(--pad) + 5px);
  pointer-events: none;
  z-index: 5;
}

  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;

  transition: transform 150ms var(--ease), color 120ms;

.tile[data-eliminated='true']:not([data-state]) .face {
  background: #5a5873;
  box-shadow: 0 5px 0 var(--ink), inset 0 -4px 0 rgba(0, 0, 0, 0.2);

}

.tile[data-sel] .face {

  box-shadow: 0 5px 0 #b30066, 0 0 0 3px var(--ink);

.tray[data-live-tier='2'] .tile[data-sel] .face,

.tray[data-live-tier='3'] .tile[data-sel] .face,

.tile[data-head],
