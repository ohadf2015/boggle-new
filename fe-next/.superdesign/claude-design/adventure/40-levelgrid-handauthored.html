<!-- @dsCard group="Adventure · Level Grid" label="Level Grid — NEO (chunky cards + chapter banners)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adventure Level Grid — Neo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#1a1a2e;--navy-l:#16213e;--cream:#FFFEF0;--ink:#0a0a12;
    --lime:#BFFF00;--pink:#FF1493;--cyan:#00FFFF;--purple:#8B5CF6;--yellow:#FFE135;--orange:#FF6B35;
    --disp:'Fredoka',sans-serif;--body:'Rubik',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0b0b16;display:flex;justify-content:center;padding:24px;font-family:var(--body);}
  .phone{width:390px;height:780px;border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0a2a3a 0%,#0a2a3a 100%);}
  .phone::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.14;
    background-image:radial-gradient(rgba(0,255,255,.5) 1.1px,transparent 1.2px);background-size:14px 14px;}
  .hdr{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:14px;}
  .back{background:var(--navy);border:2px solid var(--ink);border-radius:10px;box-shadow:2px 2px 0 var(--ink);
    width:38px;height:38px;display:grid;place-items:center;color:var(--cream);font-weight:700;font-size:18px;}
  .htitle{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);}
  .hstars{margin-left:auto;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;box-shadow:2px 2px 0 var(--ink);
    color:var(--ink);font-weight:700;font-size:13px;padding:6px 10px;}
  /* CHAPTER BANNER */
  .chap{position:relative;z-index:5;margin:6px 14px 0;background:var(--cyan);border:3px solid var(--ink);border-radius:10px;
    box-shadow:4px 4px 0 var(--ink);padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink);
    display:flex;align-items:center;justify-content:space-between;}
  .grid{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 14px;}
  .lv{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--navy);position:relative;}
  .lv .num{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);line-height:1;}
  .lv .st{display:flex;gap:2px;}
  .lv .st i{width:13px;height:13px;display:grid;place-items:center;font-size:9px;border:1.5px solid var(--ink);border-radius:4px;background:var(--yellow);color:var(--ink);}
  .lv .st i.off{background:var(--navy-l);color:#4b5b70;}
  .lv.done{background:#14352e;} .lv.done .num{color:var(--lime);}
  .lv.cur{background:var(--navy);box-shadow:5px 5px 0 var(--ink),0 0 0 4px var(--cyan);}
  .lv.cur::after{content:'PLAY';position:absolute;bottom:-3px;background:var(--pink);border:2px solid var(--ink);border-radius:6px;
    box-shadow:2px 2px 0 var(--ink);color:var(--cream);font-family:var(--disp);font-weight:700;font-size:9px;padding:2px 8px;}
  .lv.lock{background:#16212e;} .lv.lock .num{color:#3a4a5e;} .lv.lock .lk{font-size:18px;}
  /* BOSS CARD wide */
  .boss{position:relative;z-index:5;margin:6px 14px 14px;background:#2a1020;border:3px solid var(--ink);border-radius:16px;
    box-shadow:6px 6px 0 var(--ink);padding:14px;display:flex;align-items:center;gap:14px;}
  .boss .face{width:56px;height:56px;border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
    background:radial-gradient(circle at 50% 40%,var(--purple),#3a1a5e);display:grid;place-items:center;font-size:30px;}
  .boss .bt{flex:1;}
  .boss .bn{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);}
  .boss .bs{color:#c9a9ff;font-size:11px;font-weight:600;margin-top:2px;}
  .boss .go{background:var(--orange);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);font-family:var(--disp);font-weight:700;font-size:13px;padding:9px 14px;}
  .boss.lock .go{background:#4a4a5e;}
  .note{position:absolute;bottom:1px;left:0;right:0;text-align:center;color:#9fe8f2;font-size:10px;font-weight:600;z-index:9;}
</style>
</head>
<body>
  <div class="phone">
    <div class="hdr">
      <div class="back">←</div>
      <div class="htitle">🌊 Springs</div>
      <div class="hstars">⭐ 14/30</div>
    </div>

    <div class="chap"><span>📖 Chapter 1 · Shallows</span><span>Lv 1–3 ✓</span></div>
    <div class="grid">
      <div class="lv done"><div class="num">1</div><div class="st"><i>★</i><i>★</i><i>★</i></div></div>
      <div class="lv done"><div class="num">2</div><div class="st"><i>★</i><i>★</i><i>★</i></div></div>
      <div class="lv done"><div class="num">3</div><div class="st"><i>★</i><i>★</i><i class="off">★</i></div></div>
    </div>

    <div class="chap" style="background:var(--lime);"><span>📖 Chapter 2 · The Drift</span><span>Lv 4–6</span></div>
    <div class="grid">
      <div class="lv cur"><div class="num">4</div><div class="st"><i>★</i><i class="off">★</i><i class="off">★</i></div></div>
      <div class="lv lock"><div class="num">5</div><div class="lk">🔒</div></div>
      <div class="lv lock"><div class="num">6</div><div class="lk">🔒</div></div>
    </div>

    <div class="boss lock">
      <div class="face">🐙</div>
      <div class="bt"><div class="bn">The Kraken</div><div class="bs">🔒 Collect 18 ⭐ · Weakness: Fire</div></div>
      <div class="go">LV 10</div>
    </div>
    <div class="note">NEO — chunky level cards + hard shadows · chapter banners · star plates · wide menacing boss card</div>
  </div>
</body>
</html>
