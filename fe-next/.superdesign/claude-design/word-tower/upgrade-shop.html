<!-- @dsCard group="Word Tower" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word Tower — Upgrade Shop (new)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#1a1a2e;--navy-light:#16213e;--lime:#BFFF00;--cyan:#00FFFF;--yellow:#FFE135;--cream:#FFFEF0;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Rubik,sans-serif;background:#0d0d1a;display:flex;justify-content:center;padding:24px}
  .panel{width:390px;background:var(--navy-light);border:3px solid #000;border-radius:16px;box-shadow:3px 3px 0 #000;overflow:hidden}
  .display{font-family:Fredoka,sans-serif}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px;border-bottom:2px solid #000}
  .title{font-family:Fredoka;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.04em;font-size:20px}
  .sub{font-size:12px;color:var(--cream);opacity:.8;margin-top:2px}
  .bal{flex-shrink:0;background:var(--yellow);color:#000;border:2px solid #000;border-radius:9px;box-shadow:1px 1px 0 #000;padding:6px 11px;font-family:Fredoka;font-weight:700;font-size:14px}
  .list{display:flex;flex-direction:column;gap:9px;padding:12px}
  .up{display:flex;align-items:center;gap:12px;background:var(--navy);border:2px solid #000;border-radius:10px;box-shadow:1px 1px 0 #000;padding:12px}
  .up .info{flex:1;min-width:0}
  .up .name{font-family:Fredoka;font-weight:700;color:var(--white);font-size:14px;display:flex;align-items:center;gap:8px}
  .up .desc{font-size:11.5px;color:var(--cream);opacity:.72;margin-top:2px}
  .pips{display:flex;gap:3px}
  .pip{width:8px;height:8px;border-radius:50%;border:1px solid #000;background:var(--navy-light)}
  .pip.on{background:var(--lime)}
  .buy{flex-shrink:0;min-width:64px;border:2px solid #000;border-radius:9px;box-shadow:1px 1px 0 #000;padding:8px 10px;font-family:Fredoka;font-weight:700;font-size:11px;text-transform:uppercase;text-align:center;line-height:1.15}
  .buy.able{background:var(--lime);color:#000}
  .buy.broke{background:var(--navy-light);color:#7d8aa6}
  .buy.maxed{background:var(--navy-light);color:#9aa7c4}
  .buy small{display:block;font-size:10px;opacity:.9;font-weight:500}
  .foot{padding:12px}
  .done{width:100%;background:var(--cyan);color:#000;border:2px solid #000;border-radius:10px;box-shadow:2px 2px 0 #000;padding:13px;font-family:Fredoka;font-weight:700;font-size:15px;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <div>
        <div class="title">Tower Upgrades</div>
        <div class="sub">Permanent boosts — spend your coins</div>
      </div>
      <div class="bal">🪙 1,240</div>
    </div>
    <div class="list">
      <div class="up">
        <div class="info">
          <div class="name">Steady Cable <span class="pips"><i class="pip on"></i><i class="pip on"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></div>
          <div class="desc">Slows the crane swing for easier timing</div>
        </div>
        <div class="buy able">Buy<small>🪙 434</small></div>
      </div>
      <div class="up">
        <div class="info">
          <div class="name">Windbreak <span class="pips"><i class="pip on"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></div>
          <div class="desc">Calms the high-altitude wind</div>
        </div>
        <div class="buy able">Buy<small>🪙 306</small></div>
      </div>
      <div class="up">
        <div class="info">
          <div class="name">Master Architect <span class="pips"><i class="pip on"></i><i class="pip on"></i><i class="pip on"></i><i class="pip"></i><i class="pip"></i></span></div>
          <div class="desc">Bigger coin rewards on every drop</div>
        </div>
        <div class="buy broke">Buy<small>🪙 1,072</small></div>
      </div>
      <div class="up">
        <div class="info">
          <div class="name">Reinforced Core <span class="pips"><i class="pip on"></i><i class="pip on"></i></span></div>
          <div class="desc">Survive one more wobble before a topple</div>
        </div>
        <div class="buy maxed">Maxed</div>
      </div>
    </div>
    <div class="foot"><div class="done">Done</div></div>
  </div>
</body>
</html>
