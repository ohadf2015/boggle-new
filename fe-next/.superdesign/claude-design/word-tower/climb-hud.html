<!-- @dsCard group="Word Tower" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word Tower — Climb HUD (redesign)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1a1a2e; --navy-light:#16213e; --lime:#BFFF00; --pink:#FF1493;
    --cyan:#00FFFF; --purple:#8B5CF6; --orange:#FF6B35; --yellow:#FFE135;
    --cream:#FFFEF0; --white:#fff; --ink:#05060a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Rubik,sans-serif;background:#0d0d1a;display:flex;justify-content:center;padding:24px;gap:28px;flex-wrap:wrap}
  .phone{width:390px;height:760px;border-radius:28px;overflow:hidden;position:relative;
    border:3px solid #000;box-shadow:6px 6px 0 #000;
    /* orbit biome sky */
    background:linear-gradient(180deg,#04060f 0%,#0b1230 58%,#16204a 100%);}
  .display{font-family:Fredoka,sans-serif}
  .neo{border:2px solid #000;box-shadow:2px 2px 0 #000}
  .neo-lg{border:3px solid #000;box-shadow:3px 3px 0 #000}

  /* ---- top bar ---- */
  .topbar{position:absolute;inset:0 0 auto 0;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .row{display:flex;align-items:center;gap:8px}
  .biome-banner{flex:1;display:flex;align-items:center;justify-content:space-between;
    background:#16204a;border-radius:10px;padding:8px 12px}
  .biome-name{font-family:Fredoka;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.04em;font-size:15px}
  .biome-name small{color:var(--cream);opacity:.7;font-weight:500;font-size:11px;display:block;text-transform:none;letter-spacing:0}
  .alt{font-family:Fredoka;font-weight:700;color:var(--white);font-size:22px;line-height:1}
  .alt small{font-size:11px;color:var(--cyan);opacity:.85}
  .chip{display:flex;align-items:center;gap:5px;border-radius:9px;padding:6px 9px;font-family:Fredoka;font-weight:700;font-size:13px;color:#000}
  .chip.coins{background:var(--yellow)} .chip.combo{background:var(--orange)} .chip.up{background:var(--cyan)}
  .pip-row{display:flex;gap:3px}
  .pip{width:7px;height:14px;border:1.5px solid #000;border-radius:2px;background:#0e1733}
  .pip.on{background:var(--lime)}

  /* ---- tower ---- */
  .stage{position:absolute;inset:78px 0 150px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;overflow:hidden}
  .floor{width:118px;height:34px;border:2px solid #000;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-family:Fredoka;font-weight:700;color:#04223a;letter-spacing:3px;box-shadow:2px 2px 0 rgba(0,0,0,.5);position:relative}
  .floor::after{content:"";position:absolute;inset:auto 4px 3px 4px;height:6px;background:rgba(0,0,0,.18);border-radius:2px}
  .floor.c1{background:#00FFFF} .floor.c2{background:#36d0e6} .floor.c3{background:#7be0ef;transform:rotate(-1.5deg)}
  .floor.c4{background:#00FFFF} .floor.pending{background:#00FFFF;opacity:.45;border-style:dashed}
  /* greeble */
  .floor.c2::before{content:"";position:absolute;top:-9px;right:14px;width:3px;height:9px;background:#05060a;box-shadow:0 -3px 0 1px #6fe6ff}
  .crane-cable{width:4px;height:46px;background:repeating-linear-gradient(#0a1020 0 4px,#16204a 4px 8px)}
  .reticle{width:130px;height:4px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 2px #000;margin-top:2px;opacity:.9}

  /* ---- crane CTA ---- */
  .dock{position:absolute;inset:auto 0 0 0;padding:14px;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(180deg,rgba(13,13,26,0) 0%, #0d0d1a 38%)}
  .band{display:flex;gap:6px}
  .band b{flex:1;text-align:center;font-family:Fredoka;font-weight:700;font-size:11px;color:#000;border-radius:8px;padding:5px 0;text-transform:uppercase}
  .band .perfect{background:var(--lime)} .band .good{background:var(--cyan)} .band .sloppy{background:var(--yellow);opacity:.5} .band .miss{background:#FF3366;opacity:.4;color:#fff}
  .drop{width:100%;border-radius:14px;padding:16px;background:var(--lime);color:#000;font-family:Fredoka;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;text-align:center}
  .tray{display:flex;justify-content:center;gap:6px}
  .key{width:38px;height:44px;border-radius:9px;background:var(--navy-light);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700;font-size:18px}
  .key.hot{background:var(--lime);color:#000}
  .annot{position:absolute;right:-14px;top:50%;transform:translateX(100%);width:200px;color:#9fb4d6;font-size:12px;line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="phone">
    <!-- TOP BAR: biome identity + live stats -->
    <div class="topbar">
      <div class="row">
        <span class="chip up neo">✦ Upgrades</span>
        <div class="biome-banner neo">
          <div class="biome-name">Orbit<small>next: Nebula · 160m</small></div>
          <div class="alt">340<small> m</small></div>
        </div>
      </div>
      <div class="row">
        <span class="chip coins neo">🪙 1,240</span>
        <span class="chip combo neo">🔥 ×4</span>
        <div class="pip-row" title="floors to next reward">
          <span class="pip on"></span><span class="pip on"></span><span class="pip on"></span><span class="pip"></span>
        </div>
      </div>
    </div>

    <!-- TOWER -->
    <div class="stage">
      <div class="crane-cable"></div>
      <div class="floor pending">P L A N E T</div>
      <div class="reticle"></div>
      <div style="height:8px"></div>
      <div class="floor c3">C O M E T</div>
      <div class="floor c2">O R B I T</div>
      <div class="floor c1">S T A R</div>
      <div class="floor c4">M O O N</div>
    </div>

    <!-- CRANE DOCK -->
    <div class="dock">
      <div class="band">
        <b class="perfect">Perfect</b><b class="good">Good</b><b class="sloppy">Sloppy</b><b class="miss">Miss</b>
      </div>
      <div class="tray">
        <span class="key hot">P</span><span class="key">L</span><span class="key">A</span><span class="key hot">N</span><span class="key">E</span><span class="key">T</span><span class="key">R</span>
      </div>
      <div class="drop neo-lg">Tap to drop ↓</div>
    </div>
  </div>
</body>
</html>
