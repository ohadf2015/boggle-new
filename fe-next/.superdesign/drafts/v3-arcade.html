<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neo-lime: #BFFF00;
      --neo-pink: #FF1493;
      --neo-cyan: #00FFFF;
      --neo-purple: #8B5CF6;
      --neo-yellow: #FDE047;
      --neo-red: #FF3366;
      --neo-navy: #1a1a2e;
      --neo-navy-light: #16213e;
      --neo-cream: #FFFEF0;
    }

    @view-transition { navigation: auto; }

    .font-neo-display { font-family: 'Fredoka', sans-serif; }
    .font-neo-body { font-family: 'Rubik', sans-serif; }

    .bg-arcade-grid {
      background-color: var(--neo-navy);
      background-image: 
        linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(255, 20, 147, 0.15), transparent 70%);
      background-size: 20px 20px, 20px 20px, 100% 100%;
    }

    .border-neo { border: 2px solid black; }
    .border-neo-thick { border: 3px solid black; }
    .shadow-hard-sm { box-shadow: 2px 2px 0px black; }
    .shadow-hard { box-shadow: 3px 3px 0px black; }
    .shadow-hard-lg { box-shadow: 5px 5px 0px black; }
    .shadow-hard-pressed { box-shadow: 1px 1px 0px black; }
    
    .shadow-glow-lime { box-shadow: 0 0 15px rgba(191, 255, 0, 0.3), 3px 3px 0px black; }

    @keyframes wobble {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1deg); }
    }
    .animate-wobble { animation: wobble 2s ease-in-out infinite; }

    @keyframes arcade-pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.02); filter: brightness(1.2); }
    }
    .animate-arcade-pulse { animation: arcade-pulse 3s infinite; }

    .premium-dl { background-color: rgba(0, 255, 255, 0.2); color: var(--neo-cyan); box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2); }
    .premium-tl { background-color: rgba(0, 255, 255, 0.6); color: #0a0a2e; font-weight: 900; }
    .premium-dw { background-color: rgba(255, 20, 147, 0.25); color: var(--neo-pink); box-shadow: inset 0 0 10px rgba(255, 20, 147, 0.2); }
    .premium-tw { background-color: rgba(255, 20, 147, 0.7); color: white; font-weight: 900; }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 2px;
    }

    /* Individual tile tilt for physical feel */
    .tile-tilt-1 { transform: rotate(1.2deg); }
    .tile-tilt-2 { transform: rotate(-0.8deg); }
    .tile-tilt-3 { transform: rotate(0.5deg); }
  </style>
</head>
<body class="font-neo-body">
  <div class="w-full h-screen flex flex-col bg-arcade-grid text-white relative overflow-hidden">
    
    <!-- 1. Compact App Header -->
    <header class="shrink-0 pt-12 px-4 flex items-center justify-between z-10">
      <div class="flex items-center gap-3">
        <a href="#" id="header-back-link" class="w-10 h-10 flex items-center justify-center bg-neo-navy-light border-neo rounded-neo shadow-hard-sm active:translate-y-px active:shadow-hard-pressed transition-all">
          <iconify-icon icon="lucide:arrow-right" class="text-xl"></iconify-icon>
        </a>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <div class="bg-[#8B5CF6] p-1.5 border-neo shadow-hard-sm rotate-[-8deg] flex items-center">
              <iconify-icon icon="lucide:sword" class="text-white text-sm"></iconify-icon>
            </div>
            <h1 class="text-2xl font-neo-display font-black leading-none tracking-tight">WordCraft</h1>
            <span class="bg-[#FDE047] text-[#1a1a2e] text-[10px] font-black px-1.5 py-0.5 border-neo shadow-hard-sm rotate-[12deg] uppercase">
              BETA
            </span>
          </div>
          <p class="text-[11px] text-neo-cyan font-bold tracking-widest uppercase mt-0.5 opacity-80">
            Cyber-Lexical Warfare
          </p>
        </div>
      </div>
      <div class="flex gap-2">
        <div class="bg-black/60 border-neo px-2 py-1 rounded-neo flex items-center gap-1.5 shadow-hard-sm">
           <iconify-icon icon="lucide:flame" class="text-neo-pink text-sm"></iconify-icon>
           <span class="text-xs font-black tabular-nums">7x</span>
        </div>
        <button id="header-menu-btn" class="w-10 h-10 flex items-center justify-center bg-neo-navy-light border-neo rounded-neo shadow-hard-sm">
          <iconify-icon icon="lucide:layout-grid" class="text-xl text-white/80"></iconify-icon>
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-24">
      
      <!-- 2. Missions/How to play Card -->
      <div class="relative bg-[#16213e] border-neo-thick rounded-neo-lg p-4 shadow-hard-lg space-y-4 animate-wobble overflow-hidden">
        <!-- Animated scanline effect -->
        <div class="absolute inset-0 pointer-events-none bg-gradient-to-b from-white/5 to-transparent h-1/2"></div>
        
        <div class="flex justify-between items-center">
           <h3 class="font-neo-display font-black uppercase tracking-wider text-sm flex items-center gap-2 text-neo-lime">
            <iconify-icon icon="lucide:terminal" class="text-lg"></iconify-icon>
            משימה נוכחית
          </h3>
          <button id="close-tutorial-btn" class="p-1 text-white/40 hover:text-white">
            <iconify-icon icon="lucide:x" class="text-sm"></iconify-icon>
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div class="flex flex-col items-center text-center gap-1">
            <div class="w-10 h-10 rounded-neo border-2 border-black bg-neo-lime text-navy flex items-center justify-center shadow-hard-sm">
              <iconify-icon icon="lucide:mouse-pointer-click" class="text-lg text-black"></iconify-icon>
            </div>
            <span class="text-[9px] font-black leading-tight">בחר אות</span>
          </div>
          <div class="flex flex-col items-center text-center gap-1">
            <div class="w-10 h-10 rounded-neo border-2 border-black bg-neo-cyan text-navy flex items-center justify-center shadow-hard-sm">
              <iconify-icon icon="lucide:layout-template" class="text-lg text-black"></iconify-icon>
            </div>
            <span class="text-[9px] font-black leading-tight">הנח בלוח</span>
          </div>
          <div class="flex flex-col items-center text-center gap-1">
            <div class="w-10 h-10 rounded-neo border-2 border-black bg-neo-pink text-white flex items-center justify-center shadow-hard-sm">
              <iconify-icon icon="lucide:zap" class="text-lg"></iconify-icon>
            </div>
            <span class="text-[9px] font-black leading-tight">צבור בונוס</span>
          </div>
        </div>
        
        <div class="bg-black/40 rounded-neo p-2 border border-white/10">
          <p class="text-[10px] text-neo-cyan font-bold italic">
            "אל תשכח את הכוכב המרכזי - הכל מתחיל שם!"
          </p>
        </div>
      </div>

      <!-- 3. Arcade Scoreboard -->
      <div class="space-y-3">
        <div class="flex gap-3 items-stretch">
          <!-- Player 1 Card -->
          <div class="relative flex-1 min-w-[140px] p-3 rounded-neo border-neo-thick bg-gradient-to-br from-[#BFFF00]/30 to-[#BFFF00]/5 ring-4 ring-[#BFFF00] shadow-glow-lime animate-arcade-pulse">
             <div class="flex items-center gap-2 mb-1">
                <div class="w-7 h-7 rounded-full border-2 border-black bg-neo-lime text-[#1a1a2e] flex items-center justify-center shadow-hard-sm">
                  <iconify-icon icon="lucide:user-round" class="text-sm"></iconify-icon>
                </div>
                <span class="text-[10px] font-neo-display font-black uppercase text-white tracking-widest">פרוטוניקס</span>
             </div>
             <div class="text-4xl font-neo-display font-black leading-none mt-1 tabular-nums">142</div>
             <div class="mt-2 flex items-center justify-between">
               <div class="flex items-center gap-1 text-[9px] font-bold text-white/60">
                 <span class="w-2 h-2 rounded-sm bg-neo-lime"></span>
                 <span>7/7</span>
               </div>
               <div class="bg-black px-1.5 py-0.5 rounded-sm text-[8px] font-black text-neo-lime uppercase">READY</div>
             </div>
             <span class="absolute -top-3 left-4 px-2 py-0.5 text-[9px] font-black bg-black text-neo-lime border-2 border-black rounded-sm shadow-hard-sm">YOU</span>
          </div>

          <div class="flex items-center justify-center">
            <div class="w-8 h-8 rounded-full bg-black border-2 border-white/20 flex items-center justify-center transform -rotate-12">
              <span class="font-neo-display font-black text-white/40 text-sm">VS</span>
            </div>
          </div>

          <!-- WordBot Card -->
          <div class="relative flex-1 min-w-[140px] p-3 rounded-neo border-neo-thick bg-gradient-to-br from-[#FF1493]/20 to-[#FF1493]/5 border-neo shadow-hard">
            <div class="flex items-center gap-2 mb-1">
                <div class="w-7 h-7 rounded-full border-2 border-black bg-neo-pink text-white flex items-center justify-center shadow-hard-sm">
                  <iconify-icon icon="lucide:cpu" class="text-sm"></iconify-icon>
                </div>
                <span class="text-[10px] font-neo-display font-black uppercase text-white/80 tracking-widest">WordBot-V3</span>
             </div>
             <div class="text-4xl font-neo-display font-black leading-none mt-1 text-white/90 tabular-nums">98</div>
             <div class="mt-2 flex items-center justify-between">
                <div class="flex items-center gap-1 text-[9px] font-bold text-white/40">
                  <span class="w-2 h-2 rounded-sm bg-white/20"></span>
                  <span>7/7</span>
                </div>
                <div class="text-[8px] font-black text-neo-pink animate-pulse">THINKING...</div>
             </div>
          </div>
        </div>

        <!-- Status Bar -->
        <div class="flex items-center justify-between text-[11px] bg-black/60 border-neo rounded-neo-lg px-4 py-2 shadow-hard-sm border-t-white/10">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-neo-lime animate-ping"></span>
            <span class="font-black uppercase tracking-wider text-neo-lime">תורך להפציץ!</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-white/50 inline-flex items-center gap-1.5">
              <iconify-icon icon="lucide:package" class="text-neo-cyan"></iconify-icon>
              מלאי:
              <span class="text-white font-black">48</span>
            </span>
          </div>
        </div>
      </div>

      <!-- 4. Interactive Hint -->
      <div class="flex justify-center">
        <div class="group relative">
          <div class="absolute inset-0 bg-neo-lime blur-md opacity-20 group-hover:opacity-40 transition-opacity"></div>
          <div class="relative inline-flex items-center gap-3 px-6 py-2 rounded-full border-neo-thick bg-neo-lime text-[#1a1a2e] shadow-hard transition-transform active:scale-95">
            <iconify-icon icon="lucide:touchpad" class="text-lg"></iconify-icon>
            <span class="text-sm font-neo-display font-black uppercase tracking-widest italic">בחר אות למשחק</span>
          </div>
        </div>
      </div>

      <!-- 5. 13x13 Grid Board -->
      <div class="mx-auto max-w-[340px] bg-[#16213e] border-neo-thick rounded-neo-lg p-2 shadow-hard-lg relative">
        <!-- Board coordinate labels (decorative) -->
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-black px-2 py-0.5 rounded border border-white/20 text-[8px] font-black text-white/40">A-M / 1-13</div>
        
        <div class="board-grid">
          <!-- Row 1 example -->
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square premium-tw border border-black/40 rounded-sm flex items-center justify-center text-[9px]">3W</div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square premium-dl border border-black/40 rounded-sm flex items-center justify-center text-[9px]">2L</div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square premium-dl border border-black/40 rounded-sm flex items-center justify-center text-[9px]">2L</div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square premium-dl border border-black/40 rounded-sm flex items-center justify-center text-[9px]">2L</div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          <div class="aspect-square premium-tw border border-black/40 rounded-sm flex items-center justify-center text-[9px]">3W</div>
          <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>

          <!-- Filler Rows -->
          <div class="col-span-13 grid grid-cols-13 gap-0.5 py-0.5">
            <div class="col-span-13 h-16 bg-white/[0.03] rounded flex items-center justify-center"></div>
          </div>

          <!-- Center Row -->
          <div class="col-span-6 grid grid-cols-6 gap-[2px]">
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
            <div class="aspect-square premium-dw border border-black/40 rounded-sm flex items-center justify-center text-[9px]">2W</div>
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
            <div class="aspect-square premium-tl border border-black/40 rounded-sm flex items-center justify-center text-[9px]">3L</div>
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          </div>
          <div class="aspect-square bg-neo-pink border-neo flex items-center justify-center text-xl shadow-hard-sm animate-pulse rounded-sm ring-4 ring-neo-pink/20">★</div>
          <div class="col-span-6 grid grid-cols-6 gap-[2px]">
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
            <div class="aspect-square premium-tl border border-black/40 rounded-sm flex items-center justify-center text-[9px]">3L</div>
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
            <div class="aspect-square premium-dw border border-black/40 rounded-sm flex items-center justify-center text-[9px]">2W</div>
            <div class="aspect-square bg-neo-navy/60 border border-black/40 rounded-sm"></div>
          </div>

           <div class="col-span-13 grid grid-cols-13 gap-0.5 py-0.5">
            <div class="col-span-13 h-16 bg-white/[0.03] rounded flex items-center justify-center"></div>
          </div>
        </div>
      </div>

      <!-- 6. Nitro/Heat Meter -->
      <div class="w-full px-2">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-1.5">
            <iconify-icon icon="lucide:gauge" class="text-neo-cyan text-xs"></iconify-icon>
            <span class="text-[10px] font-neo-display font-black uppercase tracking-widest text-white/70">מד לחץ מילים</span>
          </div>
          <span class="text-[10px] font-black text-neo-lime tabular-nums bg-black px-1.5 rounded">30.0%</span>
        </div>
        <div class="relative h-4 bg-black border-2 border-black rounded-full overflow-hidden shadow-hard-sm">
          <div class="absolute right-0 top-0 h-full bg-gradient-to-l from-neo-lime to-neo-cyan rounded-full transition-all duration-500 shadow-[0_0_15px_rgba(191,255,0,0.5)]" style="width: 30%"></div>
          <div class="absolute inset-0 bg-[linear-gradient(45deg,rgba(255,255,255,0.1)_25%,transparent_25%,transparent_50%,rgba(255,255,255,0.1)_50%,rgba(255,255,255,0.1)_75%,transparent_75%,transparent)] bg-[length:20px_20px]"></div>
        </div>
      </div>

      <!-- 7. Tactile Tile Rack -->
      <div class="flex gap-2.5 justify-center flex-wrap p-4 bg-neo-navy-light border-neo-thick border-black rounded-neo-lg shadow-hard-lg relative">
         <div class="absolute -top-3 left-4 bg-[#8B5CF6] text-white text-[8px] px-2 py-0.5 font-black uppercase rounded border border-black shadow-hard-sm">Inventory</div>
        
        <button id="tile-1" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-cream to-[#E8E4C8] text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard tile-tilt-1 hover:scale-110 active:scale-90 transition-transform">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/60"></span>
          <span class="text-3xl font-black font-neo-display">א</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">1</span>
        </button>
        
        <button id="tile-2" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-lime to-neo-lime/80 text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard ring-4 ring-neo-lime/30 scale-110 translate-y-1 tile-tilt-2 active:scale-95 transition-transform">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/80"></span>
          <span class="text-3xl font-black font-neo-display">ב</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">3</span>
          <div class="absolute -top-2 -left-2 w-4 h-4 rounded-full bg-neo-pink border-2 border-black flex items-center justify-center animate-bounce">
             <iconify-icon icon="lucide:check" class="text-[8px] text-white font-black"></iconify-icon>
          </div>
        </button>

        <button id="tile-3" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-cream to-[#E8E4C8] text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard tile-tilt-3">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/60"></span>
          <span class="text-3xl font-black font-neo-display">ג</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">3</span>
        </button>
        
        <button id="tile-4" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-cream to-[#E8E4C8] text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/60"></span>
          <span class="text-3xl font-black font-neo-display">ד</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">2</span>
        </button>

        <button id="tile-5" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-cream to-[#E8E4C8] text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard tile-tilt-1">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/60"></span>
          <span class="text-3xl font-black font-neo-display">ה</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">1</span>
        </button>
        
        <button id="tile-6" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-cream to-[#E8E4C8] text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard tile-tilt-2">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/60"></span>
          <span class="text-3xl font-black font-neo-display">ו</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">1</span>
        </button>

        <button id="tile-7" class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-b from-neo-cream to-[#E8E4C8] text-[#1a1a2e] rounded-neo border-neo-thick shadow-hard">
          <span class="absolute inset-x-1 top-1 h-1 rounded-full bg-white/60"></span>
          <span class="text-3xl font-black font-neo-display">ז</span>
          <span class="absolute bottom-0.5 left-1 text-[9px] opacity-70 font-bold tabular-nums">8</span>
        </button>
      </div>

    </main>

    <!-- 8. Mega Sticky Bottom Controls -->
    <footer class="fixed bottom-0 left-0 right-0 z-40 px-4 pb-8 pt-4 bg-neo-navy border-t-4 border-black flex gap-3 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
      <button id="action-submit-btn" class="flex-1 h-14 bg-neo-lime text-[#1a1a2e] border-neo-thick rounded-neo font-neo-display font-black flex items-center justify-center gap-3 shadow-hard active:translate-y-px active:shadow-hard-pressed hover:brightness-110 transition-all">
        <iconify-icon icon="lucide:rocket" class="text-2xl"></iconify-icon>
        <span class="text-lg tracking-tight uppercase">שלח מילה</span>
      </button>
      
      <div class="flex gap-2">
        <button id="action-undo-btn" class="w-14 h-14 bg-neo-navy-light border-neo-thick text-neo-cyan rounded-neo flex items-center justify-center shadow-hard hover:bg-neo-cyan/10 active:translate-y-px">
          <iconify-icon icon="lucide:rotate-ccw" class="text-2xl"></iconify-icon>
        </button>
        <button id="action-skip-btn" class="w-14 h-14 bg-neo-navy-light border-neo-thick text-white/40 rounded-neo flex items-center justify-center shadow-hard active:translate-y-px">
          <iconify-icon icon="lucide:fast-forward" class="text-2xl"></iconify-icon>
        </button>
        <button id="action-shuffle-btn" class="w-14 h-14 bg-neo-navy-light border-neo-thick text-neo-pink rounded-neo flex items-center justify-center shadow-hard active:translate-y-px">
          <iconify-icon icon="lucide:shuffle" class="text-2xl"></iconify-icon>
        </button>
      </div>
    </footer>

  </div>
</body>
</html>
