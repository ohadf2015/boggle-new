<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LexiClash Single Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neo-navy: #1a1a2e;
            --neo-navy-light: #16213e;
            --neo-cream: #FFFEF0;
            --neo-cyan: #00FFFF;
            --neo-lime: #BFFF00;
            --neo-pink: #FF1493;
            --neo-yellow: #FFE135;
            --neo-black: #000000;
            --shadow-sm: 2px 2px 0px var(--neo-black);
            --shadow-md: 4px 4px 0px var(--neo-black);
            --shadow-lg: 6px 6px 0px var(--neo-black);
            --shadow-xl: 8px 8px 0px var(--neo-black);
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--neo-navy);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .bg-pattern {
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 20px 20px, 60px 60px, 60px 60px;
            position: relative;
        }

        .bg-pattern::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.04) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.5;
        }

        .neo-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            -webkit-text-stroke: 1.5px var(--neo-black);
            text-shadow: 3px 3px 0px var(--neo-black);
        }

        .btn-neo {
            position: relative;
            overflow: hidden;
            border: 3px solid var(--neo-black);
            box-shadow: var(--shadow-md);
            transition: all 0.1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-neo::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(255, 255, 255, 0.3) 50%, transparent 55%);
            animation: shimmer 4s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(30%, 30%) rotate(0deg); }
        }

        .btn-neo:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--neo-black);
        }

        .neo-card {
            position: relative;
            overflow: hidden;
            background: var(--neo-cream);
            border: 4px solid var(--neo-black);
            box-shadow: var(--shadow-lg);
            border-radius: 8px;
        }

        .neo-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, transparent 40%);
            pointer-events: none;
            z-index: 5;
        }

        .letter-tile-gradient {
            background: linear-gradient(165deg, #ffffff 0%, #fafaf9 40%, #f5f5f3 100%);
            border: 2px solid rgba(0,0,0,0.15);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .letter-tile-selected {
            background: var(--neo-cyan);
            border: 3px solid var(--neo-black);
            box-shadow: 2px 2px 0px var(--neo-black);
            z-index: 10;
            animation: pulse-cyan 1.5s infinite;
        }

        @keyframes pulse-cyan {
            0%, 100% { background-color: var(--neo-cyan); }
            50% { background-color: #7fffff; }
        }

        .score-gradient {
            background: linear-gradient(135deg, #FFE135 0%, #BFFF00 100%);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .circular-timer-track {
            fill: none;
            stroke: var(--neo-black);
            stroke-width: 4;
            opacity: 0.2;
        }

        .circular-timer-progress {
            fill: none;
            stroke: var(--neo-cyan);
            stroke-width: 10;
            stroke-linecap: square;
            stroke-dasharray: 283;
            stroke-dashoffset: 70;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.5s ease;
        }

        .combo-timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border: 1.5px solid var(--neo-black);
            border-radius: 99px;
            margin-top: 4px;
            overflow: hidden;
        }

        .combo-timer-fill {
            height: 100%;
            background: linear-gradient(to right, #fb923c, #fbbf24);
            width: 75%;
            animation: combo-drain 5s linear infinite;
        }

        .no-glare::before {
            display: none !important;
        }

        @keyframes combo-drain {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-pattern flex flex-col">
        
        <!-- 1. Header Section -->
        <header class="flex items-center justify-between px-4 pt-4 pb-2 z-10">
            <a href="#" id="quit-btn" class="btn-neo no-glare bg-red-500 text-white px-3 py-1.5 flex items-center gap-2 text-sm decoration-none">
                <iconify-icon icon="lucide:arrow-left" class="text-lg"></iconify-icon>
                QUIT
            </a>
            <button id="pause-btn" class="btn-neo no-glare bg-pink-500 text-white p-2 flex items-center justify-center">
                <iconify-icon icon="lucide:pause" class="text-xl"></iconify-icon>
            </button>
        </header>

        <!-- 2. Combo Display Row -->
        <div class="flex flex-col justify-center items-center my-2 z-10">
            <div class="flex items-center gap-2 animate-float">
                <iconify-icon icon="lucide:flame" class="text-2xl text-orange-500" style="filter: drop-shadow(0 0 8px orange)"></iconify-icon>
                <span class="font-black text-2xl italic uppercase text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-yellow-300" style="-webkit-text-stroke: 1px rgba(0,0,0,0.5); filter: drop-shadow(0 0 2px rgba(251, 146, 60, 0.5))">x3 COMBO</span>
            </div>
            <div class="w-32 combo-timer-bar">
                <div class="combo-timer-fill"></div>
            </div>
        </div>

        <!-- 3. Stats Row -->
        <div class="px-4 flex items-center justify-between mb-4 z-10 w-full max-w-md mx-auto">
            <!-- Coins Badge -->
            <div class="flex-1 flex justify-start">
                <div class="bg-yellow-400 border-3 border-black shadow-[4px_4px_0px_black] rounded-lg px-2 py-1 flex items-center gap-1.5 transform -rotate-1 hover:scale-105 transition-transform">
                    <div class="bg-black/10 rounded-full p-1">
                        <iconify-icon icon="lucide:coins" class="text-lg text-black block"></iconify-icon>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="font-black text-base text-black">450</span>
                        <span class="text-[8px] font-bold text-black/60 uppercase">COINS</span>
                    </div>
                </div>
            </div>
            
            <!-- Enhanced Timer -->
            <div class="relative flex items-center justify-center mx-2">
                <svg class="w-24 h-24 relative drop-shadow-[4px_4px_0px_rgba(0,0,0,1)]">
                    <circle cx="48" cy="48" r="42" fill="var(--neo-navy)" stroke="var(--neo-black)" stroke-width="4"></circle>
                    <circle cx="48" cy="48" r="36" fill="none" stroke="#334155" stroke-width="6"></circle>
                    <circle class="circular-timer-progress" cx="48" cy="48" r="36" style="stroke-dasharray: 226; stroke-dashoffset: 50; filter: drop-shadow(0 0 3px var(--neo-cyan)); stroke-width: 6; transform-origin: 48px 48px;"></circle>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center pt-0.5">
                    <span class="font-black text-2xl text-white tracking-tight drop-shadow-[2px_2px_0_rgba(0,0,0,1)]" style="-webkit-text-stroke: 1px black;">60</span>
                    <span class="text-[8px] font-black text-cyan-400 uppercase tracking-widest bg-black px-1 rounded-sm border border-cyan-500/50 mt-[-1px]">SEC</span>
                </div>
            </div>

            <!-- Enhanced Score Badge -->
            <div class="flex-1 flex justify-end">
                <div class="score-gradient border-3 border-black shadow-[4px_4px_0px_black] rounded-lg px-2 py-1 flex flex-col items-end transform rotate-1 hover:scale-105 transition-transform min-w-[80px]">
                    <span class="text-[8px] font-bold text-black/60 uppercase tracking-widest mb-0.5">SCORE</span>
                    <span class="font-black text-xl text-black leading-none tracking-tighter">1,250</span>
                </div>
            </div>
        </div>

        <!-- 4. Word Forming Area -->
        <div class="flex items-center justify-center mb-3 h-12 z-10 w-full max-w-[360px] mx-auto">
            <div class="flex gap-1.5">
                <div class="w-9 h-11 bg-white border-3 border-black rounded shadow-md flex items-center justify-center font-black text-xl text-black relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/50 to-transparent"></div>
                    S
                </div>
                <div class="w-9 h-11 bg-white border-3 border-black rounded shadow-md flex items-center justify-center font-black text-xl text-black relative overflow-hidden">T</div>
                <div class="w-9 h-11 bg-white border-3 border-black rounded shadow-md flex items-center justify-center font-black text-xl text-black relative overflow-hidden">A</div>
                <div class="w-9 h-11 bg-white border-3 border-black rounded shadow-md flex items-center justify-center font-black text-xl text-black relative overflow-hidden">R</div>
                <div class="w-9 h-11 bg-cyan-400 border-3 border-black rounded shadow-md flex items-center justify-center font-black text-xl text-black animate-pulse">?</div>
            </div>
        </div>

        <!-- 5. Tutorial Callout -->
        <div class="px-6 mb-2 z-10">
            <div class="bg-pink-500 border-3 border-black shadow-md p-2 rounded-lg relative animate-float overflow-hidden">
                <div class="absolute -top-10 -left-10 w-20 h-20 bg-white/20 rotate-45 pointer-events-none"></div>
                <p class="text-xs font-bold text-white text-center uppercase tracking-wide">Drag across letters to form words!</p>
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-pink-500 border-b-3 border-r-3 border-black rotate-45"></div>
            </div>
        </div>

        <!-- 6. Game Board (5x5 Grid) -->
        <div class="flex-1 flex items-start justify-center px-4 z-10">
            <div class="neo-card w-full max-w-[360px] aspect-square p-2 bg-[#FFFEF0] grid grid-cols-5 gap-1.5">
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">A</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">L</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">P</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">H</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">A</div>
                
                <div class="letter-tile-selected rounded flex items-center justify-center font-black text-2xl">S</div>
                <div class="letter-tile-selected rounded flex items-center justify-center font-black text-2xl">T</div>
                <div class="letter-tile-selected rounded flex items-center justify-center font-black text-2xl">A</div>
                <div class="letter-tile-selected rounded flex items-center justify-center font-black text-2xl">R</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">S</div>

                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">E</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">O</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">N</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">T</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">I</div>

                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">C</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">K</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">R</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">A</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">M</div>

                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">O</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">P</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">E</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">N</div>
                <div class="letter-tile-gradient rounded flex items-center justify-center font-black text-2xl">Y</div>
            </div>
        </div>

        <!-- 7. Hint Button at Bottom -->
        <footer class="p-4 flex justify-center z-10">
            <button id="hint-btn" class="btn-neo bg-cyan-400 text-black px-8 py-3 rounded-full flex items-center gap-2 group overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] pointer-events-none"></div>
                <iconify-icon icon="lucide:zap" class="text-xl animate-pulse"></iconify-icon>
                <span class="font-black tracking-widest">GET HINT</span>
            </button>
        </footer>

    </div>
</body>
</html>
