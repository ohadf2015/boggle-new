<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>LexiClash · 3D Mascot Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a2e; overflow: hidden; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(circle at 50% 35%, #2a2a48 0%, #1a1a2e 55%, #111122 100%);
      font-family: system-ui, sans-serif;
    }
    .stage { position: relative; width: min(86vw, 640px); aspect-ratio: 1 / 1; }
    /* warm spotlight glow behind the mesh */
    .stage::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 50% 36%, rgba(255,236,196,0.32), rgba(255,236,196,0.06) 45%, transparent 70%);
    }
    model-viewer {
      width: 100%; height: 100%; background: transparent; --poster-color: transparent;
    }
    .hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      color: #8a8aa8; font-size: 13px; letter-spacing: .02em;
    }
  </style>
  <script type="module" src="/vendor/model-viewer.min.js"></script>
</head>
<body>
  <div class="stage">
    <model-viewer
      src="/mascots/styles/3d/epic.gltf"
      alt="LexiClash epic knight mascot, 3D"
      camera-controls
      disable-zoom
      disable-pan
      interaction-prompt="none"
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="16deg"
      environment-image="neutral"
      exposure="1.15"
      shadow-intensity="0.9"
      shadow-softness="1"
      camera-orbit="0deg 80deg 105%"
      field-of-view="30deg"
      touch-action="pan-y"></model-viewer>
  </div>
  <div class="hint">drag to rotate · auto-spins in the spotlight</div>
</body>
</html>
