<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-hidden="true">
  <title>Poker chip edge ring</title>
  <defs>
    <mask id="ring">
      <rect width="128" height="128" fill="black"/>
      <circle cx="64" cy="64" r="60" fill="white"/>
      <circle cx="64" cy="64" r="46" fill="black"/>
    </mask>
  </defs>
  <!-- Edge band with dash notches (casino chip look) -->
  <g mask="url(#ring)">
    <circle cx="64" cy="64" r="60" fill="none" stroke="#000" stroke-width="28" opacity="0.12"/>
    <g stroke="#000" stroke-width="10" stroke-linecap="butt" opacity="0.28">
      <line x1="64" y1="4" x2="64" y2="24"/>
      <line x1="64" y1="104" x2="64" y2="124"/>
      <line x1="4" y1="64" x2="24" y2="64"/>
      <line x1="104" y1="64" x2="124" y2="64"/>
      <line x1="21" y1="21" x2="35" y2="35"/>
      <line x1="93" y1="93" x2="107" y2="107"/>
      <line x1="107" y1="21" x2="93" y2="35"/>
      <line x1="35" y1="93" x2="21" y2="107"/>
    </g>
  </g>
  <!-- Outer + inner hard borders -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="#000" stroke-width="4"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#000" stroke-width="3" opacity="0.35"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.2" stroke-dasharray="4 5"/>
</svg>
