<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LexiClash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #FFFEF0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 360px;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      color: #BFFF00;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }
    .status {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .offline-msg {
      display: none;
      font-size: 0.95rem;
      color: #999;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      display: none;
      background: #BFFF00;
      color: #1a1a2e;
      border: 3px solid #000;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .retry-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #000;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(191, 255, 0, 0.2);
      border-top-color: #BFFF00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">LexiClash</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Loading...</div>
    <div class="offline-msg" id="offline-msg">
      It looks like you're offline. Check your connection and try again.
    </div>
    <button class="retry-btn" id="retry-btn" onclick="tryConnect()">Retry</button>
  </div>
  <script>
    var TARGET = 'https://www.lexiclash.live';
    var attempts = 0;
    var maxAuto = 5;

    function tryConnect() {
      attempts++;
      document.getElementById('status').textContent = 'Connecting...';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('offline-msg').style.display = 'none';
      document.getElementById('retry-btn').style.display = 'none';

      fetch(TARGET, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
        .then(function() {
          window.location.href = TARGET;
        })
        .catch(function() {
          showOffline();
        });
    }

    function showOffline() {
      document.getElementById('status').textContent = 'Can\'t reach LexiClash';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('offline-msg').style.display = 'block';
      document.getElementById('retry-btn').style.display = 'inline-block';

      if (attempts < maxAuto) {
        setTimeout(tryConnect, 3000 * attempts);
      }
    }

    window.addEventListener('online', tryConnect);

    setTimeout(function() {
      if (!navigator.onLine) { showOffline(); }
    }, 3000);
  </script>
</body>
</html>
