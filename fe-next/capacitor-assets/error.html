<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LexiClash — Connection Issue</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #1a1a2e; color: #fffef0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
      .card { max-width: 28rem; background: #16213e; border: 3px solid #000; border-radius: 12px; box-shadow: 4px 4px 0 #000; padding: 2rem 1.5rem; }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; letter-spacing: 0.02em; color: #bfff00; }
      p { font-size: 1rem; line-height: 1.55; margin: 0 0 1.25rem; color: #fffef0cc; }
      button { background: #bfff00; color: #000; border: 3px solid #000; border-radius: 8px; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; box-shadow: 3px 3px 0 #000; }
      button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
      small { display: block; margin-top: 1.5rem; color: #fffef080; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Can’t reach LexiClash</h1>
        <p>Looks like the connection dropped. Check Wi-Fi or mobile data, then try again.</p>
        <button type="button" onclick="location.href='https://www.lexiclash.live'">Retry</button>
        <small>If this keeps happening, reopen the app or reinstall.</small>
      </div>
    </main>
  </body>
</html>
