[phases.setup]
nixPkgs = ['nodejs_20']
aptPkgs = []

[phases.install]
dependsOn = ['setup']
cmds = [
    'NODE_ENV=development npm install --prefer-offline --no-audit --no-fund --loglevel=error'
]
cacheDirectories = ['node_modules', '.next/cache']

[phases.build]
dependsOn = ['install']
cmds = [
    'NODE_ENV=production npm run build --loglevel=error 2>&1 | grep -v "baseline-browser-mapping"'
]

[start]
cmd = 'npm start'

[variables]
NPM_CONFIG_LOGLEVEL = 'error'
