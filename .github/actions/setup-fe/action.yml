name: Set up fe-next
description: Node 20, npm ci in fe-next, and optionally the i18n assets and compiled schemas tests import.
inputs:
  prebuild:
    description: Build the i18n assets and backend schemas
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: fe-next/package-lock.json
    - shell: bash
      working-directory: fe-next
      run: |
        # @posthog/cli's postinstall downloads a GitHub release asset that often 504s. CI never
        # uploads source maps, so after two tries install without scripts and rebuild every
        # package with an install script except @posthog/cli.
        for i in 1 2; do
          npm ci --prefer-offline --no-audit && exit 0
          echo "npm ci attempt $i failed; retrying in 15s"; sleep 15
        done
        echo "::warning::npm ci failing, falling back to --ignore-scripts + selective rebuild"
        npm ci --prefer-offline --no-audit --ignore-scripts
        npm rebuild @firebase/util @parcel/watcher @swc/core core-js esbuild msgpackr-extract msw protobufjs sharp unrs-resolver
        npm rebuild @sentry/cli || echo "::warning::@sentry/cli binary missing (only used for source map upload)"
        npx esbuild --version
        node -e "require('sharp'); console.log('sharp OK')"
    - if: inputs.prebuild == 'true'
      shell: bash
      working-directory: fe-next
      run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
