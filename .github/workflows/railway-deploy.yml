name: Railway Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # Deploy preview environment for PRs
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy PR Preview
        id: deploy
        run: |
          # Create or update PR environment
          railway environment --create "pr-${{ github.event.pull_request.number }}" 2>/dev/null || true

          # Set environment variables for preview (block search engine indexing)
          railway variables --set "NEXT_PUBLIC_IS_PREVIEW=true" --environment "pr-${{ github.event.pull_request.number }}" 2>/dev/null || true

          railway up --environment "pr-${{ github.event.pull_request.number }}" --detach

          # Get the deployment URL
          DEPLOY_URL=$(railway domain --environment "pr-${{ github.event.pull_request.number }}" 2>/dev/null || echo "")
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const prNumber = context.payload.pull_request.number;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Railway Preview')
            );

            const body = `## 🚂 Railway Preview

            | Environment | URL |
            |-------------|-----|
            | Preview | ${url || 'Deploying...'} |

            Last updated: ${new Date().toISOString()}

            ---
            <sub>🔒 Preview environments are blocked from search engine indexing (robots.txt + noindex meta).</sub>
            <sub>Preview environments are automatically destroyed when the PR is closed.</sub>`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

  # Cleanup preview environment when PR is closed
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Delete PR environment
        run: |
          railway environment --delete "pr-${{ github.event.pull_request.number }}" --yes 2>/dev/null || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Comment cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🚂 Railway Preview

              ✅ Preview environment \`pr-${prNumber}\` has been destroyed.`
            });

  # Production deploy on merge to main/master
  deploy-production:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lexiclash.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Production
        run: |
          railway up --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Create deployment summary
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
