name: CI (Bun)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

concurrency:
  group: bun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.1'
  CACHE_PREFIX: bun-v1

jobs:
  # Install dependencies with Bun
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            fe-next/node_modules
            ~/.bun/install/cache
          key: ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-${{ hashFiles('fe-next/package-lock.json', 'fe-next/bun.lockb') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        working-directory: fe-next
        run: bun install

  # Lint (reuse existing config)
  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            fe-next/node_modules
            ~/.bun/install/cache
          key: ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-${{ hashFiles('fe-next/package-lock.json', 'fe-next/bun.lockb') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install if cache miss
        working-directory: fe-next
        run: |
          if [ ! -d "node_modules" ]; then
            bun install
          fi

      - name: Check translations
        working-directory: fe-next
        run: bun run check:translations

      - name: Lint
        working-directory: fe-next
        run: bun run lint

  # Type check
  type-check:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            fe-next/node_modules
            ~/.bun/install/cache
          key: ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-${{ hashFiles('fe-next/package-lock.json', 'fe-next/bun.lockb') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install if cache miss
        working-directory: fe-next
        run: |
          if [ ! -d "node_modules" ]; then
            bun install
          fi

      - name: Type check
        working-directory: fe-next
        run: bunx tsc --noEmit

  # Tests with Bun
  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            fe-next/node_modules
            ~/.bun/install/cache
          key: ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-${{ hashFiles('fe-next/package-lock.json', 'fe-next/bun.lockb') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install if cache miss
        working-directory: fe-next
        run: |
          if [ ! -d "node_modules" ]; then
            bun install
          fi

      - name: Run backend tests with Bun
        working-directory: fe-next
        run: bun run test:backend
        env:
          CI: true

      - name: Run frontend tests with Bun
        working-directory: fe-next
        run: bun run test:frontend
        env:
          CI: true

  # Build with Bun
  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            fe-next/node_modules
            ~/.bun/install/cache
          key: ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-${{ hashFiles('fe-next/package-lock.json', 'fe-next/bun.lockb') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-deps-${{ runner.os }}-
          fail-on-cache-miss: false

      - name: Install if cache miss
        working-directory: fe-next
        run: |
          if [ ! -d "node_modules" ]; then
            bun install
          fi

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            fe-next/.next/cache
          key: bun-${{ runner.os }}-nextjs-${{ hashFiles('fe-next/package-lock.json') }}-${{ hashFiles('fe-next/**/*.ts', 'fe-next/**/*.tsx') }}
          restore-keys: |
            bun-${{ runner.os }}-nextjs-${{ hashFiles('fe-next/package-lock.json') }}-

      - name: Build with Bun
        working-directory: fe-next
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Summary job
  ci-bun-success:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ One or more Bun CI jobs failed"
            exit 1
          fi
          echo "✅ All Bun CI checks passed"

      - name: Create summary
        if: always()
        run: |
          echo "## Bun CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
