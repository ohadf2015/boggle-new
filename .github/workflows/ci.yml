name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe-next/package-lock.json

      - name: Install dependencies
        working-directory: fe-next
        run: npm ci

      - name: Check translations
        working-directory: fe-next
        run: npm run check:translations

      - name: Lint
        working-directory: fe-next
        run: npm run lint

      - name: Type check
        working-directory: fe-next
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe-next/package-lock.json

      - name: Install dependencies
        working-directory: fe-next
        run: npm ci

      - name: Run tests
        working-directory: fe-next
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-check, test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe-next/package-lock.json

      - name: Install dependencies
        working-directory: fe-next
        run: npm ci

      - name: Build
        working-directory: fe-next
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
