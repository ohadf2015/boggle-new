name: CI

on:
  pull_request:
    branches: [master, main]
  # Every merge re-runs the whole suite on master; a failure opens an issue (ci-failure-assistant.yml).
  push:
    branches: [master, main]
  # radar-loop dispatches this on its bot PRs, which GITHUB_TOKEN cannot trigger.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A master push is never cancelled by the next one: every merged commit gets its full run.
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Two gates:
#   ci-success  REQUIRED for merge. Needs `quick` and `types`: Railway's build stops at the type check, so a type
#               error on master blocks every deploy.
#   ci-full     NOT required. Waits for lint, tsc, the sharded tests, guards and backend, and fails the run when
#               any of them fails, so a PR shows red within minutes and a bad merge to master opens an issue.
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checks only read code, so skip the ~900 MB of audio, images and content (a full checkout took 2m17s).
      # Blobless + sparse: git fetches only the files that are checked out.
      - uses: actions/checkout@v4
        with:
          # HEAD^1 is the PR base (or the previous master commit on a push).
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/daily-content/
            !/docs/
            !/wk/
            !/stickers/
            !/fe-next/public/
            !/fe-next/raw/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Quick checks (run together)
        run: |
          set +e
          # typescript alone, outside the repo, so `npm ci` (2 GB) is not needed for the translations scan.
          ( mkdir -p /tmp/ts && cd /tmp/ts && npm init -y >/dev/null && npm i typescript@5.9.3 --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 ) &
          TS_PID=$!

          ( # Conflict markers in what this change touched (a scripted resolve once committed them to master).
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- . ':!*.lock' ':!*package-lock.json')
            [ -z "$FILES" ] && exit 0
            if echo "$FILES" | xargs git grep -nE '^(<<<<<<<|>>>>>>>) ' HEAD -- 2>/dev/null | grep -q .; then
              echo "::error::conflict markers committed"; echo "$FILES" | xargs git grep -nE '^(<<<<<<<|>>>>>>>) ' HEAD -- | head; exit 1
            fi
          ) > /tmp/markers.log 2>&1 &
          M_PID=$!

          ( if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --no-tags --shallow-since="$(date -u -d '30 days ago' +%F)" origin "${{ github.base_ref }}" &&
              node fe-next/scripts/ci/check-seo-freeze.mjs HEAD^1 HEAD
            fi
          ) > /tmp/seo.log 2>&1 &
          S_PID=$!

          wait $TS_PID
          ( cd fe-next && NODE_PATH=/tmp/ts/node_modules node scripts/find-missing-translations.js ) > /tmp/translations.log 2>&1
          T_RC=$?
          wait $M_PID; M_RC=$?
          wait $S_PID; S_RC=$?

          for n in markers seo translations; do echo "::group::$n"; tail -25 /tmp/$n.log; echo "::endgroup::"; done
          echo "rc: markers=$M_RC seo=$S_RC translations=$T_RC"
          [ $M_RC -eq 0 ] && [ $S_RC -eq 0 ] && [ $T_RC -eq 0 ]

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: |
          # @posthog/cli's postinstall downloads a GitHub release asset that is currently
          # 504ing on most fetches (GitHub asset-storage issue, verified from outside CI).
          # The binary is only used by `next build` sourcemap upload, which CI never runs.
          # Retry plain npm ci twice (sometimes an edge node serves the asset), then fall
          # back to --ignore-scripts + selective rebuild of every install-script package
          # EXCEPT @posthog/cli.
          ok=0
          for i in 1 2; do
            if npm ci --prefer-offline --no-audit; then ok=1; break; fi
            echo "npm ci attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::npm ci failing on @posthog/cli asset 504s — falling back to --ignore-scripts + selective rebuild"
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild @firebase/util @parcel/watcher @swc/core core-js esbuild msgpackr-extract msw protobufjs sharp unrs-resolver
            npm rebuild @sentry/cli || echo "::warning::@sentry/cli binary missing (only used by next build sourcemap upload, not CI)"
            npx esbuild --version
            node -e "require('sharp'); console.log('sharp OK')"
          fi
        working-directory: fe-next
      - name: Lint
        working-directory: fe-next
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- . | grep -E '\.(js|jsx|ts|tsx|mjs)$' | sed 's#^fe-next/##' || true)
            [ -z "$FILES" ] && { echo "no lintable files changed"; exit 0; }
            echo "$FILES" | xargs npx eslint --no-warn-ignored
          else
            npm run lint
          fi

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: |
          # @posthog/cli's postinstall downloads a GitHub release asset that is currently
          # 504ing on most fetches (GitHub asset-storage issue, verified from outside CI).
          # The binary is only used by `next build` sourcemap upload, which CI never runs.
          # Retry plain npm ci twice (sometimes an edge node serves the asset), then fall
          # back to --ignore-scripts + selective rebuild of every install-script package
          # EXCEPT @posthog/cli.
          ok=0
          for i in 1 2; do
            if npm ci --prefer-offline --no-audit; then ok=1; break; fi
            echo "npm ci attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::npm ci failing on @posthog/cli asset 504s — falling back to --ignore-scripts + selective rebuild"
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild @firebase/util @parcel/watcher @swc/core core-js esbuild msgpackr-extract msw protobufjs sharp unrs-resolver
            npm rebuild @sentry/cli || echo "::warning::@sentry/cli binary missing (only used by next build sourcemap upload, not CI)"
            npx esbuild --version
            node -e "require('sharp'); console.log('sharp OK')"
          fi
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npx tsc --noEmit
        working-directory: fe-next
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # Frontend tests, sharded. On a PR, --changed picks the tests whose import graph touches the diff;
  # a shared file (translations, a context) selects a large slice, so the slice is split across shards.
  # workflow_dispatch and master pushes run the full suite over the same shards.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: |
          # @posthog/cli's postinstall downloads a GitHub release asset that is currently
          # 504ing on most fetches (GitHub asset-storage issue, verified from outside CI).
          # The binary is only used by `next build` sourcemap upload, which CI never runs.
          # Retry plain npm ci twice (sometimes an edge node serves the asset), then fall
          # back to --ignore-scripts + selective rebuild of every install-script package
          # EXCEPT @posthog/cli.
          ok=0
          for i in 1 2; do
            if npm ci --prefer-offline --no-audit; then ok=1; break; fi
            echo "npm ci attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::npm ci failing on @posthog/cli asset 504s — falling back to --ignore-scripts + selective rebuild"
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild @firebase/util @parcel/watcher @swc/core core-js esbuild msgpackr-extract msw protobufjs sharp unrs-resolver
            npm rebuild @sentry/cli || echo "::warning::@sentry/cli binary missing (only used by next build sourcemap upload, not CI)"
            npx esbuild --version
            node -e "require('sharp'); console.log('sharp OK')"
          fi
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Frontend tests (shard ${{ matrix.shard }}/6)
        working-directory: fe-next
        env:
          CI: true
        # Gate on each JSON report, not vitest's exit code: a worker fork can crash at
        # teardown after every test passed (see assert-vitest-passed.mjs).
        run: |
          run_vitest() {
            NAME="$1"; shift
            OUT="$PWD/vitest-$NAME.json"
            set +e
            npx vitest run "$@" --passWithNoTests --reporter=default --reporter=json --outputFile.json="$OUT"
            RC=$?
            set -e
            # A clean exit that selected no tests (a shard that touches nothing relevant) is fine;
            # any other zero-test report still fails the assert below.
            if [ "$RC" = 0 ] && node -e "process.exit(require('$OUT').numTotalTests === 0 ? 0 : 1)"; then
              echo "$NAME: no tests selected"
              return 0
            fi
            node scripts/ci/assert-vitest-passed.mjs "$OUT" "$RC"
          }
          SHARD="--shard=${{ matrix.shard }}/6"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run_vitest frontend --config vitest.config.ts --changed HEAD^1 "$SHARD"
          else
            run_vitest frontend --config vitest.config.ts "$SHARD"
          fi

  # Guard tests read source files instead of importing them, so --changed cannot see them: they always run on a PR.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: |
          # @posthog/cli's postinstall downloads a GitHub release asset that is currently
          # 504ing on most fetches (GitHub asset-storage issue, verified from outside CI).
          # The binary is only used by `next build` sourcemap upload, which CI never runs.
          # Retry plain npm ci twice (sometimes an edge node serves the asset), then fall
          # back to --ignore-scripts + selective rebuild of every install-script package
          # EXCEPT @posthog/cli.
          ok=0
          for i in 1 2; do
            if npm ci --prefer-offline --no-audit; then ok=1; break; fi
            echo "npm ci attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::npm ci failing on @posthog/cli asset 504s — falling back to --ignore-scripts + selective rebuild"
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild @firebase/util @parcel/watcher @swc/core core-js esbuild msgpackr-extract msw protobufjs sharp unrs-resolver
            npm rebuild @sentry/cli || echo "::warning::@sentry/cli binary missing (only used by next build sourcemap upload, not CI)"
            npx esbuild --version
            node -e "require('sharp'); console.log('sharp OK')"
          fi
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Guard tests
        working-directory: fe-next
        env:
          CI: true
        run: |
          set +e
          OUT="$PWD/vitest-guards.json"
          npx vitest run --config vitest.config.ts guard --passWithNoTests --reporter=default --reporter=json --outputFile.json="$OUT"
          RC=$?
          set -e
          node scripts/ci/assert-vitest-passed.mjs "$OUT" "$RC"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: |
          # @posthog/cli's postinstall downloads a GitHub release asset that is currently
          # 504ing on most fetches (GitHub asset-storage issue, verified from outside CI).
          # The binary is only used by `next build` sourcemap upload, which CI never runs.
          # Retry plain npm ci twice (sometimes an edge node serves the asset), then fall
          # back to --ignore-scripts + selective rebuild of every install-script package
          # EXCEPT @posthog/cli.
          ok=0
          for i in 1 2; do
            if npm ci --prefer-offline --no-audit; then ok=1; break; fi
            echo "npm ci attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::npm ci failing on @posthog/cli asset 504s — falling back to --ignore-scripts + selective rebuild"
            npm ci --prefer-offline --no-audit --ignore-scripts
            npm rebuild @firebase/util @parcel/watcher @swc/core core-js esbuild msgpackr-extract msw protobufjs sharp unrs-resolver
            npm rebuild @sentry/cli || echo "::warning::@sentry/cli binary missing (only used by next build sourcemap upload, not CI)"
            npx esbuild --version
            node -e "require('sharp'); console.log('sharp OK')"
          fi
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Backend tests
        working-directory: fe-next
        env:
          CI: true
        run: |
          set +e
          OUT="$PWD/vitest-backend.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx vitest run --config backend/vitest.config.ts --changed HEAD^1 --passWithNoTests --reporter=default --reporter=json --outputFile.json="$OUT"
          else
            npx vitest run --config backend/vitest.config.ts --reporter=default --reporter=json --outputFile.json="$OUT"
          fi
          RC=$?
          set -e
          if [ "$RC" = 0 ] && node -e "process.exit(require('$OUT').numTotalTests === 0 ? 0 : 1)"; then
            echo "backend: no tests selected"; exit 0
          fi
          node scripts/ci/assert-vitest-passed.mjs "$OUT" "$RC"

  # REQUIRED branch-protection gate; keep the name. Waits for quick and types.
  ci-success:
    runs-on: ubuntu-latest
    needs: [quick, types]
    if: always()
    steps:
      - run: |
          [[ "${{ needs.quick.result }}" == "success" ]] || { echo "❌ quick checks failed"; exit 1; }
          [[ "${{ needs.types.result }}" == "success" ]] || { echo "❌ type check failed"; exit 1; }

  # NOT required. Fails the run if any heavy job failed, so the PR shows red and master opens an issue.
  ci-full:
    runs-on: ubuntu-latest
    needs: [quick, lint, types, test, guards, backend]
    if: always()
    steps:
      - run: |
          for r in "${{ needs.quick.result }}" "${{ needs.lint.result }}" "${{ needs.types.result }}" "${{ needs.test.result }}" "${{ needs.backend.result }}"; do
            [[ "$r" == "success" ]] || { echo "❌ a full-suite job did not succeed"; exit 1; }
          done
          G="${{ needs.guards.result }}"
          [[ "$G" == "success" || "$G" == "skipped" ]] || { echo "❌ guards failed"; exit 1; }
