name: CI

on:
  pull_request:
    branches: [master, main]
  # radar-loop dispatches this on its bot PRs, which GITHUB_TOKEN cannot trigger.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The SEO freeze check diffs the PR merge commit against its base (HEAD^1).
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npm run check:translations && npm run lint
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npx tsc --noEmit
        working-directory: fe-next
      - name: Check SEO freeze
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --shallow-since="$(date -u -d '30 days ago' +%F)" origin "${{ github.base_ref }}"
          node fe-next/scripts/ci/check-seo-freeze.mjs HEAD^1 HEAD

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Backend tests
        if: matrix.shard == 1
        working-directory: fe-next
        run: npx vitest run --config backend/vitest.config.ts
        env:
          CI: true
      - name: Frontend tests (shard ${{ matrix.shard }}/3)
        working-directory: fe-next
        # Gate on the JSON report, not vitest's exit code: a worker fork can crash
        # at teardown after every test passed (see assert-vitest-passed.mjs).
        run: |
          set +e
          npx vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/3 \
            --reporter=default --reporter=json --outputFile.json=vitest-shard-${{ matrix.shard }}.json
          VITEST_RC=$?
          set -e
          node scripts/ci/assert-vitest-passed.mjs vitest-shard-${{ matrix.shard }}.json "$VITEST_RC"
        env:
          CI: true

  # Branch-protection gate; keep the name.
  ci-success:
    runs-on: ubuntu-latest
    needs: [check, test]
    if: always()
    steps:
      - run: |
          [[ "${{ needs.check.result }}" == "success" && "${{ needs.test.result }}" == "success" ]] || { echo "❌ failed"; exit 1; }
