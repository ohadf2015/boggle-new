name: CI

on:
  pull_request:
    branches: [master, main]
  # radar-loop dispatches this on its bot PRs, which GITHUB_TOKEN cannot trigger.
  # A dispatch runs the FULL test suite; a pull_request run tests only what the PR touches.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^1 is the PR base: the SEO freeze check and the changed-files lint diff against it.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npm run check:translations
        working-directory: fe-next
      - name: Lint
        working-directory: fe-next
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- . | grep -E '\.(js|jsx|ts|tsx|mjs)$' | sed 's#^fe-next/##' || true)
            [ -z "$FILES" ] && { echo "no lintable files changed"; exit 0; }
            echo "$FILES" | xargs npx eslint --no-warn-ignored
          else
            npm run lint
          fi
      - name: Check SEO freeze
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --shallow-since="$(date -u -d '30 days ago' +%F)" origin "${{ github.base_ref }}"
          node fe-next/scripts/ci/check-seo-freeze.mjs HEAD^1 HEAD

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npx tsc --noEmit
        working-directory: fe-next

  # Frontend tests, sharded. On a PR, --changed picks the tests whose import graph touches the diff;
  # a shared file (translations, a context) selects a large slice, so the slice is split across shards
  # instead of running serially. workflow_dispatch runs the full suite over the same shards.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Frontend tests (shard ${{ matrix.shard }}/6)
        working-directory: fe-next
        env:
          CI: true
        # Gate on each JSON report, not vitest's exit code: a worker fork can crash at
        # teardown after every test passed (see assert-vitest-passed.mjs).
        run: |
          run_vitest() {
            NAME="$1"; shift
            OUT="$PWD/vitest-$NAME.json"
            set +e
            npx vitest run "$@" --passWithNoTests --reporter=default --reporter=json --outputFile.json="$OUT"
            RC=$?
            set -e
            # A clean exit that selected no tests (a shard or PR that touches nothing relevant) is fine;
            # any other zero-test report still fails the assert below.
            if [ "$RC" = 0 ] && node -e "process.exit(require('$OUT').numTotalTests === 0 ? 0 : 1)"; then
              echo "$NAME: no tests selected"
              return 0
            fi
            node scripts/ci/assert-vitest-passed.mjs "$OUT" "$RC"
          }
          SHARD="--shard=${{ matrix.shard }}/6"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run_vitest frontend --config vitest.config.ts --changed HEAD^1 "$SHARD"
          else
            run_vitest frontend --config vitest.config.ts "$SHARD"
          fi

  # Guard tests read source files instead of importing them, so --changed cannot see them: they always run,
  # in parallel with the shards rather than after them.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Guard tests
        working-directory: fe-next
        env:
          CI: true
        # Gate on each JSON report, not vitest's exit code: a worker fork can crash at
        # teardown after every test passed (see assert-vitest-passed.mjs).
        run: |
          run_vitest() {
            NAME="$1"; shift
            OUT="$PWD/vitest-$NAME.json"
            set +e
            npx vitest run "$@" --passWithNoTests --reporter=default --reporter=json --outputFile.json="$OUT"
            RC=$?
            set -e
            # A clean exit that selected no tests (a shard or PR that touches nothing relevant) is fine;
            # any other zero-test report still fails the assert below.
            if [ "$RC" = 0 ] && node -e "process.exit(require('$OUT').numTotalTests === 0 ? 0 : 1)"; then
              echo "$NAME: no tests selected"
              return 0
            fi
            node scripts/ci/assert-vitest-passed.mjs "$OUT" "$RC"
          }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run_vitest guards --config vitest.config.ts guard
          else
            echo "guards run inside the full shards on dispatch"
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fe-next/package-lock.json
      - run: npm ci --prefer-offline --no-audit
        working-directory: fe-next
      - run: npx tsx scripts/build-i18n-assets.ts --skip-brotli && npm run build:schemas
        working-directory: fe-next
      - name: Backend tests
        working-directory: fe-next
        env:
          CI: true
        # Gate on each JSON report, not vitest's exit code: a worker fork can crash at
        # teardown after every test passed (see assert-vitest-passed.mjs).
        run: |
          run_vitest() {
            NAME="$1"; shift
            OUT="$PWD/vitest-$NAME.json"
            set +e
            npx vitest run "$@" --passWithNoTests --reporter=default --reporter=json --outputFile.json="$OUT"
            RC=$?
            set -e
            # A clean exit that selected no tests (a shard or PR that touches nothing relevant) is fine;
            # any other zero-test report still fails the assert below.
            if [ "$RC" = 0 ] && node -e "process.exit(require('$OUT').numTotalTests === 0 ? 0 : 1)"; then
              echo "$NAME: no tests selected"
              return 0
            fi
            node scripts/ci/assert-vitest-passed.mjs "$OUT" "$RC"
          }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run_vitest backend --config backend/vitest.config.ts --changed HEAD^1
          else
            run_vitest backend --config backend/vitest.config.ts
          fi

  # Branch-protection gate; keep the name.
  ci-success:
    runs-on: ubuntu-latest
    needs: [check, types, test, guards, backend]
    if: always()
    steps:
      - run: |
          for r in "${{ needs.check.result }}" "${{ needs.types.result }}" "${{ needs.test.result }}" "${{ needs.guards.result }}" "${{ needs.backend.result }}"; do [[ "$r" == "success" ]] || { echo "❌ failed"; exit 1; }; done
