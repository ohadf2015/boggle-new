name: radar-merged

# Closes the Growth Radar loop for a radar/* PR only. A merge completes the recommendation
# and records the intervention the 28-day scorer grades; a close without merge puts the
# recommendation back in the backlog. Product/UX PRs are not this workflow — they opt in
# with a GR-Intervention trailer, recorded by gr-intervention.yml on push to master.
on:
  pull_request:
    types: [closed]

jobs:
  close-loop:
    if: startsWith(github.head_ref, 'radar/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GROWTH_RADAR_TOKEN: ${{ secrets.GROWTH_RADAR_TOKEN }}
      BODY: ${{ github.event.pull_request.body }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      REF: ${{ github.head_ref }}
      MERGED: ${{ github.event.pull_request.merged }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The radar block parser is shared with radar-fix.yml, which checks the same block before the PR opens.
      - uses: actions/checkout@v4
        if: github.event.pull_request.merged
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
      - run: |
          mcp() {
            local out
            out=$(curl -sS --fail-with-body -H "Authorization: Bearer $GROWTH_RADAR_TOKEN" -H 'content-type: application/json' \
              https://growthradar.app/api/mcp \
              -d "$(jq -n --arg n "$1" --argjson a "$2" '{jsonrpc:"2.0",id:1,method:"tools/call",params:{name:$n,arguments:$a}}')") \
              || { echo "::error::$1: HTTP call failed: $out"; return 1; }
            printf '%s response: %s\n' "$1" "$out"
            if ! printf '%s' "$out" | jq -e '.error == null and .result.isError != true and ([.result.content[]?.text | fromjson? | .ok?][0] != false)' > /dev/null; then
              echo "::error::$1 returned an error: $(printf '%s' "$out" | jq -r '[.error.message?, (.result.content[]?.text | fromjson? | .error?)] | map(select(. != null)) | join("; ")' 2>/dev/null)"
              return 1
            fi
            MCP_TEXT=$(printf '%s' "$out" | jq -c '.result.content[0].text | fromjson? // {}')
          }
          record() {
            mcp record_intervention "$1" || return 1
            local line
            line=$(printf '%s' "$MCP_TEXT" | jq -r 'if .duplicateOf then "deduped to existing intervention #\(.duplicateOf), nothing new written" elif .alreadyRecordedToday then "already recorded today as intervention #\(.id), nothing new written" elif .id then "recorded intervention #\(.id)" else "recorded (no id in response)" end')
            echo "record_intervention: $line"
            echo "Growth Radar record_intervention: $line" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$MERGED" != true ]; then
            id=${REF#radar/}
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "hunted fix, no recommendation to reopen"; exit 0; }
            mcp update_recommendation "{\"id\":$id,\"action\":\"reopen\"}"
            exit 0
          fi
          meta=$(printf '%s\n' "$BODY" | bash .github/scripts/radar-block.sh "$REF")
          if [ -z "$meta" ]; then
            # A radar/<id> PR opened by hand has no block: the branch still names the row, but kind/metric would be guesses.
            id=${REF#radar/}
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::warning::hunted fix with no radar block: nothing to complete or record"; exit 0; }
            mcp update_recommendation "{\"id\":$id,\"action\":\"complete\"}"
            msg="Growth Radar row $id is marked complete. This PR has no radar block, so no intervention was recorded and nothing will be graded: call record_intervention with recommendationId $id, kind and metric from the row's fix."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR_NUMBER" -R "$REPO" --body "$msg" || echo "::warning::could not comment on the PR (caller needs pull-requests: write)"
            exit 0
          fi
          id=$(printf '%s' "$meta" | jq -r '.recommendationId // empty')
          if [ -n "$id" ]; then
            mcp update_recommendation "{\"id\":$id,\"action\":\"complete\"}"
          fi
          args=$(printf '%s' "$meta" | jq -c --arg pr "$PR_URL" --arg id "$id" \
            '{app,surface,kind,metric,summary,hypothesis,evidence:$pr} | with_entries(select(.value != null)) + (if $id == "" then {} else {recommendationId:($id|tonumber)} end)')
          record "$args"
